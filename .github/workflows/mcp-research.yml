name: TrainAiCad MCP research
on:
  workflow_dispatch:
  push:
    paths:
      - 'services/trainaicad-mcp/**'
      - 'requirements.txt'
      - '.github/workflows/mcp-research.yml'
  pull_request:
    paths:
      - 'services/trainaicad-mcp/**'
      - 'requirements.txt'
      - '.github/workflows/mcp-research.yml'

jobs:
  mcp-research:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/trainaicad-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/trainaicad-mcp/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ../../requirements.txt
      - run: npm ci
      - run: npm run check
      - name: MCP Inspector e2e
        run: |
          npm run dev > /tmp/trainaicad-mcp.log 2>&1 &
          MCP_PID=$!
          trap 'kill $MCP_PID 2>/dev/null || true' EXIT
          sleep 2
          bash scripts/e2e_inspector.sh
