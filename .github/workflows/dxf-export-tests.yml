name: TrainAiCad regression
on:
  push:
    paths:
      - 'AGENTS.md'
      - 'AI_ENTRYPOINT.md'
      - 'skills/**'
      - 'references/**'
      - 'regression/**'
      - 'tools/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/dxf-export-tests.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'AI_ENTRYPOINT.md'
      - 'skills/**'
      - 'references/**'
      - 'regression/**'
      - 'tools/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/dxf-export-tests.yml'
jobs:
  serializer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/ -q
