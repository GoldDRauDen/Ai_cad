name: TrainAiCad regression
on:
  push:
    paths:
      - 'AGENTS.md'
      - 'AI_ENTRYPOINT.md'
      - 'skills/**'
      - 'references/**'
      - 'regression/**'
      - 'tools/**'
      - 'tests/**'
      - 'services/trainaicad-mcp/**'
      - 'requirements.txt'
      - '.github/workflows/dxf-export-tests.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'AI_ENTRYPOINT.md'
      - 'skills/**'
      - 'references/**'
      - 'regression/**'
      - 'tools/**'
      - 'tests/**'
      - 'services/trainaicad-mcp/**'
      - 'requirements.txt'
      - '.github/workflows/dxf-export-tests.yml'
jobs:
  serializer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/trainaicad-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/trainaicad-mcp/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: MCP Inspector e2e
        run: |
          npm run dev > /tmp/trainaicad-mcp.log 2>&1 &
          MCP_PID=$!
          trap 'kill $MCP_PID 2>/dev/null || true' EXIT
          sleep 2
          bash scripts/e2e_inspector.sh
