    approved_rule_status: EXISTING_PRODUCTION_RULES_ONLY
    historical_incidents_confirmed: null
    new_incidents: []
    recurrence_since_catalog: 0
    production_escapes_since_catalog: 0
    response_state: UNACTIVATED_DRAFT
