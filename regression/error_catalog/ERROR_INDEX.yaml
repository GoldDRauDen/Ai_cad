    - CURVE_ENTITY_EQUIVALENCE
    - DERIVED_TOLERANCE
    source_evidence_required:
    - actual user-proven numeric units
    - existing AI DXF vs user-approved reference first for that audit request
    - physical-curve comparison and exact printed vs derived-only tolerance
    gate_ids:
    - G_REFERENCE_AUDIT
    approved_rule_status: EXISTING_PRODUCTION_RULES_ONLY
    historical_incidents_confirmed: null
    new_incidents: []
    recurrence_since_catalog: 0
    production_escapes_since_catalog: 0
