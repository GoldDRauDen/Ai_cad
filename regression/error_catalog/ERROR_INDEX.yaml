    - OUTSIDE_EDGE_DIMENSION
    - REFERENCE_DIMENSION
    source_evidence_required:
    - two actual witness endpoints and endpoint types
    - dimension-to-feature family identity
    - consistent independent chain closure
    gate_ids:
