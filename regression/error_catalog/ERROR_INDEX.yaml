# PHASE 1 PASSIVE INDEX ONLY; approved for repository storage, NOT a production skill.
# Historical case examples are NOT verified recurrence events or released-production escapes.
schema_version: 1.0-PASSIVE
status: PASSIVE_INDEX_NOT_PRODUCTION_SKILL
repo: GoldDRauDen/TrainAiCad
inventory_snapshot_commit: 5646e2af94b520385c986a79723a3788fb43d3ab
# Inventory commit identifies the inspected regression sources, NOT a pinned skill.
source_entrypoint: AI_ENTRYPOINT.md
phase1_integration:
  auto_load_by_agent: false
  automatic_escalation: false
  exporter_or_qa_hooks: false
  incident_history_recording: false
  read_only_manual_cli: true
active_production_skill: skills/lispcad/portable/SKILL_LISPCAD_CURRENT.md
authority:
  priority:
  - user current explicit instructions
  - current approved portable production skill and modules
  - currently applicable approved regressions
  - this catalog as retrieval and QA metadata only
  new_lesson_requires_direct_user_approval: true
  unknown_customer_dimension_may_not_be_filled_from_regression: true
  existing_cad_skill_gates_never_relaxed_by_this_catalog: true
  no_automatic_skill_mutation: true
  legacy_superseded_fragments_never_override_current_skill: true
severity_levels:
  L1_ADVISORY: Non-cut metadata/presentation discrepancy with no demonstrated manufacturing geometry impact.
  L2_LOCAL_FEATURE: One isolated local feature; contained and detected before release.
  L3_MAJOR_GEOMETRY: Wrong dimensional witness, source coverage, cut geometry, or group can scrap affected
    part.
  L4_CUT_RISK: Wrong datum/contour/unfold/process/identity/release gate may produce a plausibly valid but incorrect
    manufacturing file.
severity_rule: Baseline is a triage proposal, not a score calculated from number of historical regression files;
  raise to L4 for an actual production escape. Existing skill release gate always takes precedence.
event_policy:
  event_scope: one independently verified production-job + mechanism signature; multiple codes hit by the same
    underlying defect in a job count one event, retain affected_codes
  count_only: reviewed events with exact job ID, source artifact, observed wrong result, correct expected result,
    detection stage, root-cause evidence
  historical_cases_are_examples_not_recurrence_counters: true
  historical_production_escape_state: UNKNOWN_NOT_ASSUMED_ZERO
  counters_since_catalog_start_at_zero: true
  release_escape_definition: incorrect DXF was actually marked production PASS/released and failure was discovered
    after release; REVIEW_ONLY old-AI mismatch is not automatically an escape
  detection_stage_values:
  - PDF_READING
  - GEOMETRY_BUILD
  - PRE_EXPORT_QA
  - SAVED_DXF_READBACK
  - POST_PRODUCTION_RELEASE
  - CUSTOMER_OPERATOR
  recurrence_response:
    '1': ADVISORY_PLUS_REGRESSION
    '2': MANDATORY_PREFLIGHT_EVIDENCE
    '3': HARD_GATE_REVIEW_ONLY_IF_UNPROVEN
    4+: SYSTEMIC_DETERMINISTIC_GUARD_OR_MANUAL_ENGINEERING_HOLD
  production_escape_override: At first confirmed production escape, immediately HARD_GATE and engineering root-cause
    review; consider manual hold or deterministic guard based on risk. Never lower an existing production-skill
    gate.
  reset_policy: Never erase original incident history. A verified fix creates a new effective-rule revision;
    retain previous counts and monitor post-fix recurrence separately.
  auto_promotion_to_skill: false
gates:
  G_SOURCE: Source PDF actually available, all relevant images viewed, original physical outlines/notices inspected.
  G_SOURCE_VIEW: Separately proved true source-view topology, not just bounding rectangles.
  G_DATUM: Physical per-view origin and axis signs locked, with explicit source-to-CAD transform.
  G_DIMENSION: Every used dimension linked to actual two witness endpoints, feature family and correct datum.
  G_GEOMETRY: Real material contour ordered and non-self-intersecting; physical arcs/features represented.
  G_FEATURE: Feature family quantities/types/leader scope, including cancellations and source->represented
    cut union.
  G_UNFOLD: Face sequence, ID→OD, Nobi, actual flat and physically clipped paired bend lines.
  G_SEMANTIC_QA: Actually executed CAD/PDF manufacturing QA; not merely claimed checks or structural header
    pass.
  G_DXF_READBACK: Serialized saved file audited including all original entities, true curves and layout translation.
  G_RELEASE: No global production PASS with any unresolved feature, unknown source or preview part; REVIEW_ONLY
    means NO CUT.
  G_REFERENCE_AUDIT: For existing-output audit only, compare AI DXF with user-approved reference first, actual
    units proven, then diagnose via PDF.
families:
  SOURCE_COVERAGE:
    description: Missing relevant source views, witness lines or corrections, or substituting view bounds for
      actual view geometry.
    baseline_severity: L3
    risk_tags:
    - MULTI_VIEW
    - SECTION_VIEW
    - CROWDED_DIMENSIONS
    - HANDWRITTEN_NOTE
    - PDF_SOURCE_UNAVAILABLE
    source_evidence_required:
    - original PDF readable
    - all applicable views, sections and corrections inspected
    - proven visible source-view topology; never substitute bbox
    gate_ids:
    - G_SOURCE
    - G_SOURCE_VIEW
    approved_rule_status: EXISTING_PRODUCTION_RULES_ONLY
    historical_incidents_confirmed: null
    new_incidents: []
    recurrence_since_catalog: 0
    production_escapes_since_catalog: 0
    response_state: UNACTIVATED_DRAFT
  DATUM_FRAME:
    description: Wrong physical zero, coordinate-axis signs, or source-ordinate to CAD transformation.
    baseline_severity: L4
    risk_tags:
